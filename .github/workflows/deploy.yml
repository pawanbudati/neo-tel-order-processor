name: Deploy consumer

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'DEPLOYMENT.md'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-consumer
  cancel-in-progress: false

jobs:
  deploy-yuva:
    name: Deploy to Yuva VM
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure SSH
        id: setup_ssh
        env:
          SSH_PRIVATE_KEY: ${{ secrets.GCP_VM_SSH_KEY_YUVA || secrets.GCP_VM_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.GCP_VM_KNOWN_HOSTS_YUVA || secrets.GCP_VM_KNOWN_HOSTS }}
          VM_HOST: ${{ secrets.GCP_VM_HOST_YUVA || vars.GCP_VM_HOST_YUVA }}
          VM_PORT: ${{ vars.GCP_VM_SSH_PORT_YUVA || vars.GCP_VM_SSH_PORT || '22' }}
        run: |
          if [ -z "$VM_HOST" ]; then
            echo "GCP_VM_HOST_YUVA is not set. Skipping Yuva deployment."
            echo "skip=true" >> "$GITHUB_ENV"
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          fi
          ssh-keyscan -p "$VM_PORT" -H "$VM_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sync consumer files to Yuva VM
        if: env.skip != 'true'
        env:
          VM_HOST: ${{ secrets.GCP_VM_HOST_YUVA || vars.GCP_VM_HOST_YUVA }}
          VM_USER: ${{ secrets.GCP_VM_USER_YUVA || vars.GCP_VM_USER_YUVA || secrets.GCP_VM_USER || vars.GCP_VM_USER }}
          VM_PORT: ${{ vars.GCP_VM_SSH_PORT_YUVA || vars.GCP_VM_SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.CONSUMER_DEPLOY_PATH_YUVA || vars.CONSUMER_DEPLOY_PATH || '/home/' }}
        run: |
          if [ "$DEPLOY_PATH" = '/home/' ]; then DEPLOY_PATH="/home/$VM_USER/apps/neo-tel-order-processor"; fi
          ssh -i ~/.ssh/deploy_key -p "$VM_PORT" -o StrictHostKeyChecking=accept-new "$VM_USER@$VM_HOST" "mkdir -p '$DEPLOY_PATH'"
          ssh -i ~/.ssh/deploy_key -p "$VM_PORT" "$VM_USER@$VM_HOST" 'if ! command -v rsync >/dev/null 2>&1; then if command -v apt-get >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y rsync; elif command -v dnf >/dev/null 2>&1; then sudo dnf install -y rsync; elif command -v yum >/dev/null 2>&1; then sudo yum install -y rsync; else echo "No supported package manager found to install rsync" >&2; exit 1; fi; fi'
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.env' --include='.env.example' --exclude='.env.*' \
            --exclude='.venv/' --exclude='venv/' \
            --exclude='logs/' --exclude='*.log' \
            -e "ssh -i ~/.ssh/deploy_key -p $VM_PORT -o StrictHostKeyChecking=accept-new" \
            ./ "$VM_USER@$VM_HOST:$DEPLOY_PATH/"
          ssh -i ~/.ssh/deploy_key -p "$VM_PORT" -o StrictHostKeyChecking=accept-new "$VM_USER@$VM_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' bash '$DEPLOY_PATH/deploy/deploy.sh'"

