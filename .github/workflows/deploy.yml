          VM_USER: ${{ secrets.GCP_VM_USER_PAVAN || vars.GCP_VM_USER_PAVAN || secrets.GCP_VM_USER || vars.GCP_VM_USER }}
          VM_PORT: ${{ vars.GCP_VM_SSH_PORT_PAVAN || vars.GCP_VM_SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.CONSUMER_DEPLOY_PATH_PAVAN || vars.CONSUMER_DEPLOY_PATH || '/home/' }}
          LOG_CLEANUP_CRON: ${{ secrets.LOG_CLEANUP_CRON_PAVAN || vars.LOG_CLEANUP_CRON_PAVAN || secrets.LOG_CLEANUP_CRON || vars.LOG_CLEANUP_CRON || '0 8 * * *' }}
          GCP_PUBSUB_KEY: ${{ secrets.GCP_PUBSUB_KEY_PAVAN || secrets.GCP_PUBSUB_KEY }}
        run: |
          TARGET="${VM_IP:-$VM_HOST}"
          if [ "$DEPLOY_PATH" = '/home/' ]; then DEPLOY_PATH="/home/$VM_USER/apps/neo-tel-order-processor"; fi
          ssh -i ~/.ssh/deploy_key -p "$VM_PORT" -o StrictHostKeyChecking=accept-new "$VM_USER@$TARGET" "mkdir -p '$DEPLOY_PATH'"
          ssh -i ~/.ssh/deploy_key -p "$VM_PORT" "$VM_USER@$TARGET" 'if ! command -v rsync >/dev/null 2>&1; then if command -v apt-get >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y rsync; elif command -v dnf >/dev/null 2>&1; then sudo dnf install -y rsync; elif command -v yum >/dev/null 2>&1; then sudo yum install -y rsync; else echo "No supported package manager found to install rsync" >&2; exit 1; fi; fi'
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.env' --include='.env.example' --exclude='.env.*' \
            --exclude='.venv/' --exclude='venv/' \
            --exclude='logs/' --exclude='*.log' \
            --exclude='runtime/' \
            --exclude='*.json' \
            -e "ssh -i ~/.ssh/deploy_key -p $VM_PORT -o StrictHostKeyChecking=accept-new" \
            ./ "$VM_USER@$TARGET:$DEPLOY_PATH/"
          if [ -n "$GCP_PUBSUB_KEY" ]; then
            echo "Deploying GCP Pub/Sub service account key to $TARGET:$DEPLOY_PATH/gcp-pubsub-key.json..."
            printf '%s\n' "$GCP_PUBSUB_KEY" | ssh -i ~/.ssh/deploy_key -p "$VM_PORT" -o StrictHostKeyChecking=accept-new "$VM_USER@$TARGET" \
              "cat > '$DEPLOY_PATH/gcp-pubsub-key.json' && chmod 600 '$DEPLOY_PATH/gcp-pubsub-key.json'"
            echo "Key successfully provisioned."
          fi
          ssh -i ~/.ssh/deploy_key -p "$VM_PORT" -o StrictHostKeyChecking=accept-new "$VM_USER@$TARGET" \
